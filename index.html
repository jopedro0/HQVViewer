
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HQViewer</title>

    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>

    <main class="library">

        <header class="library-header">
            <div class="header-text">
                <h1>Talvez seja Blacksad</h1>
            </div>

            <span class="book-count">Sarah, me pague</span>
        </header>

        <section class="book-grid" aria-label="Biblioteca de quadrinhos">

            <!-- Livro 1 -->
            <article class="book-card">
                <a href="/books_viewer/livro1.html" class="book-cover">
                    <img
                        src="/assets/books/livro_1/Blacksad_pg (1).jpg"
                        alt="Capa do quadrinho Blacksad"
                        loading="lazy"
                    >
                </a>

                <a href="/books_viewer/livro1.html" class="book-title">
                    <span>Livro 1 - Algum Lugar em Meio às Sombras</span>
                    <span class="arrow" aria-hidden="true">→</span>
                </a>
            </article>

            <!-- Livro 2 -->
